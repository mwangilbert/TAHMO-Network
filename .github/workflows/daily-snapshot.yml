name: Daily network snapshot

on:
  schedule:
    # 03:00 UTC = 06:00 EAT (East Africa Time is UTC+3, no DST)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Take snapshot
        run: python scripts/take_snapshot.py snapshots.json

      - name: Commit snapshot
        run: |
          git config user.name "tahmo-snapshot-bot"
          git config user.email "actions@github.com"
          git add snapshots.json
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily network snapshot $(date -u +%Y-%m-%d)"
          git push
